name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  listener:
    name: listener (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r listener/requirements.txt
          .venv/bin/pip install ruff
      - name: pytest
        run: .venv/bin/python -m pytest listener -q
      - name: ruff
        run: .venv/bin/ruff check listener

  hud:
    name: hud + electron (npm test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Node that Electron 44 ships: the main process relies on its global WebSocket.
          node-version: "24"
      - name: Install dependencies
        run: npm install
        working-directory: app
      - name: npm test
        run: npm test
        working-directory: app
