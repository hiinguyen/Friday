# F.R.I.D.A.Y. HUD overlay (sourced from ~/.config/hypr/UserConfigs/WindowRules.conf)
# Internal fullscreen (2) puts the HUD above bars on the focused monitor while
# the client stays unaware (0), so the transparent window is not resized by
# Electron. The HUD draws its own animations, so compositor ones are disabled.
windowrule = match:class ^(friday)$, float on, size monitor_w monitor_h, move 0 0, fullscreen_state 2 0, border_size 0, no_shadow on, rounding 0, no_anim on

# Start (or restart after a Hyprland reload/crash) the background service once
# the compositor's environment is visible to systemd.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user restart friday.service
